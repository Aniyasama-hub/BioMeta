<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPI · BioWorkbench</title><style>
html,body{height:100%;margin:0;background:#faf8f2;color:#242c29;font:13px system-ui,sans-serif}header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #d6d1c5}strong{margin-right:auto;font-family:Georgia,serif;font-size:18px}button,select{border:1px solid #bab7ab;background:#fffdf8;color:#26342e;padding:6px 10px;border-radius:2px;cursor:pointer}#cy{height:calc(100% - 104px);min-height:380px}footer{padding:9px 16px;font:12px ui-monospace,monospace;border-top:1px solid #d6d1c5}#detail{color:#8f3f2f}button:hover{background:#ece5d8}@media(max-width:600px){header{flex-wrap:wrap}strong{width:100%}}
</style></head><body><header><strong>关系图谱</strong><button type="button" title="拖动节点；滚轮缩放；点击节点查看属性。切换布局不会改变已保存的静态图。" aria-label="网络操作说明">?</button><select id="layout"><option value="preset">保存的布局</option><option value="circle">圆形</option><option value="grid">网格</option><option value="cose">力导向</option></select><button id="fit">适应画布</button><button id="labels">标签开关</button><button id="png">导出 PNG</button></header><div id="cy"></div><footer><span id="detail"></span></footer>
<script type="application/json" id="network-data">__NETWORK_DATA__</script><script src="cytoscape.min.js"></script><script>
const data=JSON.parse(document.getElementById('network-data').textContent);
const cy=cytoscape({container:document.getElementById('cy'),elements:data.elements,layout:{name:'preset',fit:true,padding:35},style:[{selector:'node',style:{'background-color':'data(color)','width':'data(size)','height':'data(size)','label':'data(displayLabel)','font-size':12,'color':'#292f2b','text-valign':'bottom','text-margin-y':5,'border-width':1,'border-color':'#faf8f2'}},{selector:'edge',style:{'line-color':data.edgeColor,'width':data.edgeWidth,'opacity':data.edgeAlpha,'curve-style':'bezier'}},{selector:':selected',style:{'border-width':3,'border-color':'#bd4d35'}}]});
let showLabels=data.elements.some(e=>e.group==='nodes' && e.data.displayLabel);document.getElementById('fit').onclick=()=>cy.fit(null,35);
document.getElementById('layout').onchange=e=>cy.layout({name:e.target.value,animate:false,padding:35}).run();
document.getElementById('labels').onclick=()=>{showLabels=!showLabels;cy.nodes().style('label',showLabels?'data(label)':'');};
cy.on('tap','node',e=>{const n=e.target.data();document.getElementById('detail').textContent=`  ${n.id} · degree ${n.degree}`;});
document.getElementById('png').onclick=()=>{const a=document.createElement('a');a.download='network-current-view.png';a.href=cy.png({bg:data.background,full:true,scale:2});a.click();};
</script></body></html>
